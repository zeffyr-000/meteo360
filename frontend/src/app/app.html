<mat-sidenav-container class="app-container">

  <mat-sidenav
    mode="over"
    [opened]="menuOpen()"
    (openedChange)="menuOpen.set($event)"
  >
    <div class="sidenav-brand">
      <span class="sidenav-brand__mark" aria-hidden="true">M360</span>
      <span class="sidenav-brand__name">{{ 'app.title' | transloco }}</span>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        (click)="menuOpen.set(false)"
      >
        <mat-icon matListItemIcon>cloud</mat-icon>
        <span matListItemTitle>{{ 'nav.home' | transloco }}</span>
      </a>

      <a
        mat-list-item
        routerLink="/legal"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        (click)="menuOpen.set(false)"
      >
        <mat-icon matListItemIcon>gavel</mat-icon>
        <span matListItemTitle>{{ 'nav.legal' | transloco }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="masthead">
      <button
        class="masthead__menu"
        mat-icon-button
        type="button"
        [attr.aria-label]="menuOpen() ? ('nav.close_menu' | transloco) : ('nav.open_menu' | transloco)"
        [matTooltip]="menuOpen() ? ('nav.close_menu' | transloco) : ('nav.open_menu' | transloco)"
        (click)="toggleMenu()"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <div class="masthead__brand">
        <span class="masthead__mark" aria-hidden="true">M360</span>
        <span class="masthead__copy">
          <span class="masthead__eyebrow">{{ 'app.eyebrow' | transloco }}</span>
          <span class="masthead__name">{{ 'app.title' | transloco }}</span>
        </span>
      </div>

      <div class="masthead__rule" aria-hidden="true"></div>

      <div class="masthead__actions">
        <span
          class="masthead__status"
          [class.is-syncing]="forecastState.loading() || locationState.locating()"
        >
          <span class="masthead__status-dot" aria-hidden="true"></span>
          {{ forecastState.loading() || locationState.locating() ? ('app.syncing' | transloco) : ('app.live_dashboard' | transloco) }}
        </span>
        <button
          class="masthead__icon-btn"
          mat-icon-button
          type="button"
          [attr.aria-label]="'search.open_tooltip' | transloco"
          [matTooltip]="'search.open_tooltip' | transloco"
          (click)="openSearch()"
        >
          <mat-icon>search</mat-icon>
        </button>
        <button
          class="masthead__icon-btn"
          mat-icon-button
          type="button"
          [attr.aria-label]="'app.refresh' | transloco"
          [matTooltip]="'app.refresh' | transloco"
          [disabled]="forecastState.loading() || locationState.locating()"
          (click)="refresh()"
        >
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </header>

    <main class="stage">
      <router-outlet />
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>

<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
  @switch (glyph()) {
    @case ('sun') {
      <circle cx="32" cy="32" r="11" fill="currentColor" stroke="none" />
      <g stroke-width="3.5">
        <line x1="32" y1="6"  x2="32" y2="14" />
        <line x1="32" y1="50" x2="32" y2="58" />
        <line x1="6"  y1="32" x2="14" y2="32" />
        <line x1="50" y1="32" x2="58" y2="32" />
        <line x1="14" y1="14" x2="20" y2="20" />
        <line x1="44" y1="44" x2="50" y2="50" />
        <line x1="14" y1="50" x2="20" y2="44" />
        <line x1="44" y1="20" x2="50" y2="14" />
      </g>
    }
    @case ('moon') {
      <path d="M42 8 a26 26 0 1 0 14 38 a20 20 0 0 1 -14 -38 z" fill="currentColor" stroke="currentColor" />
      <circle cx="22" cy="22" r="1.4" fill="currentColor" stroke="none" />
      <circle cx="14" cy="38" r="1" fill="currentColor" stroke="none" />
      <circle cx="50" cy="22" r="1.2" fill="currentColor" stroke="none" />
    }
    @case ('cloud') {
      <path d="M14 44 h36 a8 8 0 0 0 0 -16 a12 12 0 0 0 -23 -3 a8 8 0 0 0 -13 9 a7 7 0 0 0 0 10 z" fill="currentColor" stroke="currentColor" />
    }
    @case ('partly-cloudy') {
      <circle cx="22" cy="22" r="8" fill="currentColor" stroke="none" />
      <g stroke-width="2.5">
        <line x1="22" y1="6"  x2="22" y2="10" />
        <line x1="6"  y1="22" x2="10" y2="22" />
        <line x1="10" y1="10" x2="13" y2="13" />
        <line x1="31" y1="10" x2="34" y2="13" />
      </g>
      <path d="M18 50 h32 a7 7 0 0 0 0 -14 a10 10 0 0 0 -20 -2 a7 7 0 0 0 -12 8 a6 6 0 0 0 0 8 z" fill="currentColor" stroke="currentColor" />
    }
    @case ('rain') {
      <path d="M14 36 h36 a8 8 0 0 0 0 -16 a12 12 0 0 0 -23 -3 a8 8 0 0 0 -13 9 a7 7 0 0 0 0 10 z" fill="currentColor" stroke="currentColor" />
      <line x1="20" y1="44" x2="14" y2="58" stroke-width="3.5" />
      <line x1="32" y1="44" x2="26" y2="58" stroke-width="3.5" />
      <line x1="44" y1="44" x2="38" y2="58" stroke-width="3.5" />
    }
    @case ('snow') {
      <path d="M14 36 h36 a8 8 0 0 0 0 -16 a12 12 0 0 0 -23 -3 a8 8 0 0 0 -13 9 a7 7 0 0 0 0 10 z" fill="currentColor" stroke="currentColor" />
      <g stroke-width="2.5">
        <g transform="translate(18 48)">
          <line x1="-4" y1="0" x2="4" y2="0" />
          <line x1="0" y1="-4" x2="0" y2="4" />
          <line x1="-3" y1="-3" x2="3" y2="3" />
          <line x1="-3" y1="3" x2="3" y2="-3" />
        </g>
        <g transform="translate(32 54)">
          <line x1="-4" y1="0" x2="4" y2="0" />
          <line x1="0" y1="-4" x2="0" y2="4" />
          <line x1="-3" y1="-3" x2="3" y2="3" />
          <line x1="-3" y1="3" x2="3" y2="-3" />
        </g>
        <g transform="translate(46 48)">
          <line x1="-4" y1="0" x2="4" y2="0" />
          <line x1="0" y1="-4" x2="0" y2="4" />
          <line x1="-3" y1="-3" x2="3" y2="3" />
          <line x1="-3" y1="3" x2="3" y2="-3" />
        </g>
      </g>
    }
    @case ('storm') {
      <path d="M14 32 h36 a8 8 0 0 0 0 -16 a12 12 0 0 0 -23 -3 a8 8 0 0 0 -13 9 a7 7 0 0 0 0 10 z" fill="currentColor" stroke="currentColor" />
      <path d="M32 38 L24 50 H30 L26 60 L42 44 H34 L38 38 Z" fill="currentColor" stroke="currentColor" stroke-linejoin="miter" />
    }
    @case ('fog') {
      <g stroke-width="3.5" stroke-linecap="square">
        <line x1="8"  y1="20" x2="56" y2="20" />
        <line x1="12" y1="32" x2="52" y2="32" />
        <line x1="6"  y1="44" x2="46" y2="44" />
        <line x1="18" y1="56" x2="58" y2="56" />
      </g>
    }
  }
</svg>

name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-sftp
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to OVH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build:prod

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: curl, json, mbstring

      - name: Check PHP syntax
        run: find . -path './frontend' -prune -o -path './www/dist' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check OVH SFTP secrets
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_REMOTE_DIR: ${{ secrets.OVH_SFTP_REMOTE_DIR }}
        run: |
          test -n "$OVH_SFTP_HOST"
          test -n "$OVH_SFTP_PORT"
          test -n "$OVH_SFTP_USER"
          test -n "$OVH_SFTP_PASSWORD"
          test -n "$OVH_SFTP_REMOTE_DIR"

      - name: Validate OVH SFTP target
        env:
          OVH_SFTP_REMOTE_DIR: ${{ secrets.OVH_SFTP_REMOTE_DIR }}
        run: |
          # The OVH SFTP account is scoped to the Meteo360 project directory.
          # The recommended value is `/`, which is normalised to `.` (session root).
          # A relative path (e.g. `www/meteo360`) is still accepted for back-compat.
          squeezed_remote_dir="$(printf '%s' "$OVH_SFTP_REMOTE_DIR" | tr -s '/')"

          case "$squeezed_remote_dir" in
            "/")
              normalized_remote_dir="."
              ;;
            "."|"./")
              echo "OVH_SFTP_REMOTE_DIR values . and ./ are invalid. Use / when the SFTP account is scoped to the Meteo360 project directory, or use a safe relative path such as www/meteo360 when the account has a broader SFTP root." >&2
              exit 1
              ;;
            *)
              normalized_remote_dir="$(printf '%s' "$squeezed_remote_dir" | sed -E 's#^/##; s#/$##')"
              if [[ -z "$normalized_remote_dir" \
                || ! "$normalized_remote_dir" =~ ^[A-Za-z0-9._/-]+$ \
                || "$normalized_remote_dir" =~ (^|/)\.\.?(/|$) \
                || "$normalized_remote_dir" =~ (^|/)\.[^/]+(/|$) ]]; then
                echo "OVH_SFTP_REMOTE_DIR must be / (project-scoped SFTP account) or a safe relative path. Only letters, digits, slash, dot, underscore, and hyphen are allowed; dot segments and dot-prefixed segments are not allowed." >&2
                exit 1
              fi
              ;;
          esac

          printf 'REMOTE_DIR=%s\n' "$normalized_remote_dir" >> "$GITHUB_ENV"

      - name: Prepare release
        run: |
          rm -rf release
          mkdir -p release/var
          rsync -a app/ release/app/
          rsync -a modules/ release/modules/
          rsync -a plugins/ release/plugins/
          rsync -a var/config/ release/var/config/
          rsync -a www/ release/www/
          rsync -a application.init.php project.xml release/

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Preflight OVH SFTP target
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          write_test_dir=".deploy-write-test-$(date +%s)-$$"
          create_remote_target_command=""

          if [[ "$REMOTE_DIR" != "." ]]; then
            create_remote_target_command="mkdir -p \"$REMOTE_DIR\""
          fi

          lftp -u "$OVH_SFTP_USER","$OVH_SFTP_PASSWORD" -p "$OVH_SFTP_PORT" "sftp://$OVH_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm yes
          $create_remote_target_command
          cd "$REMOTE_DIR"
          pwd
          mkdir "$write_test_dir"
          rmdir "$write_test_dir"
          quit
          EOF

      - name: Upload release to OVH SFTP
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          create_remote_target_command=""

          if [[ "$REMOTE_DIR" != "." ]]; then
            create_remote_target_command="mkdir -p \"$REMOTE_DIR\""
          fi

          # var/cache is intentionally not created here:
          # Jelix temp/cache lives at ../jelix/temp/meteo360, outside the SFTP scope.
          # var/log is provisioned because Jelix writes file logs to var/log/ (see app/system/mainconfig.ini.php).
          # var/sessions is provisioned because Jelix sessions use app:var/sessions/.
          lftp -u "$OVH_SFTP_USER","$OVH_SFTP_PASSWORD" -p "$OVH_SFTP_PORT" "sftp://$OVH_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm yes
          lcd release
          $create_remote_target_command
          cd "$REMOTE_DIR"
          mkdir -p var
          mkdir -p var/log
          mkdir -p var/sessions
          mirror --reverse --delete --verbose app app
          mirror --reverse --delete --verbose modules modules
          mirror --reverse --delete --verbose plugins plugins
          mirror --reverse --delete --verbose var/config var/config
          mirror --reverse --delete --verbose www www
          put -O . application.init.php
          put -O . project.xml
          quit
          EOF

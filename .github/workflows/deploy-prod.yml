name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-sftp
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to OVH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build:prod

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: curl, json, mbstring

      - name: Check PHP syntax
        run: find . -path './frontend' -prune -o -path './www/dist' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check OVH SFTP secrets
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_REMOTE_DIR: ${{ secrets.OVH_SFTP_REMOTE_DIR }}
        run: |
          test -n "$OVH_SFTP_HOST"
          test -n "$OVH_SFTP_PORT"
          test -n "$OVH_SFTP_USER"
          test -n "$OVH_SFTP_PASSWORD"
          test -n "$OVH_SFTP_REMOTE_DIR"

      - name: Validate OVH SFTP target
        env:
          OVH_SFTP_REMOTE_DIR: ${{ secrets.OVH_SFTP_REMOTE_DIR }}
        run: |
          squeezed_remote_dir="$(printf '%s' "$OVH_SFTP_REMOTE_DIR" | tr -s '/')"
          use_session_root=false

          case "$squeezed_remote_dir" in
            "/")
              normalized_remote_dir="."
              use_session_root=true
              ;;
            "."|"./")
              echo "OVH_SFTP_REMOTE_DIR values . and ./ are invalid. Use / when the SFTP account is already scoped to the Meteo360 project directory, or use a relative path such as www/meteo360." >&2
              exit 1
              ;;
            *)
              normalized_remote_dir="$(printf '%s' "$squeezed_remote_dir" | sed -E 's#^/##; s#/$##')"
              ;;
          esac

          if [[ -z "$normalized_remote_dir" ]]; then
            echo "OVH_SFTP_REMOTE_DIR must not be empty. Use a project-specific relative path such as www/meteo360, or use / when the SFTP account is already scoped to the Meteo360 project directory." >&2
            exit 1
          fi

          if [[ "$use_session_root" != true && ( \
            ! "$normalized_remote_dir" =~ ^[A-Za-z0-9._/-]+$ \
            || "$normalized_remote_dir" =~ (^|/)\.\.?(/|$) \
            || "$normalized_remote_dir" =~ (^|/)\.[^/]+(/|$) ) ]]; then
            echo "OVH_SFTP_REMOTE_DIR must point to the Meteo360 project directory relative to the SFTP root, for example www/meteo360. Only letters, digits, slash (/), dot (.), underscore (_), and hyphen (-) are allowed. Dot segments and dot-prefixed segments are not allowed. Use / only when the SFTP account is already scoped to the Meteo360 project directory." >&2
            exit 1
          fi

          printf 'REMOTE_DIR=%s\n' "$normalized_remote_dir" >> "$GITHUB_ENV"

      - name: Prepare release
        run: |
          rm -rf release
          mkdir -p release/var
          rsync -a app/ release/app/
          rsync -a modules/ release/modules/
          rsync -a plugins/ release/plugins/
          rsync -a var/config/ release/var/config/
          rsync -a www/ release/www/
          rsync -a application.init.php project.xml release/

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Preflight OVH SFTP target
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_STRICT_REMOTE_DIR_VALIDATION: ${{ vars.OVH_STRICT_REMOTE_DIR_VALIDATION }}
        run: |
          write_test_dir=".deploy-write-test-$(date +%s)-$$"
          www_write_test_dir="${write_test_dir}-www"
          create_remote_target_command=""

          if [[ "$REMOTE_DIR" != "." ]]; then
            create_remote_target_command="mkdir -p \"$REMOTE_DIR\""
          fi

          remote_target_snapshot="$(
            lftp -u "$OVH_SFTP_USER","$OVH_SFTP_PASSWORD" -p "$OVH_SFTP_PORT" "sftp://$OVH_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm yes
          $create_remote_target_command
          cd "$REMOTE_DIR"
          pwd
          cls -1
          quit
          EOF
          )"

          remote_target_path="$(printf '%s\n' "$remote_target_snapshot" | sed -n '1p')"
          remote_target_entry_count="$(printf '%s\n' "$remote_target_snapshot" | tail -n +2 | sed '/^$/d' | wc -l | tr -d ' ')"

          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            printf '%s\n' "$remote_target_snapshot"
          else
            printf 'Resolved remote deployment target: %s\n' "$remote_target_path"
            printf 'Visible entries in deployment target: %s\n' "$remote_target_entry_count"
          fi

          if [[ "$REMOTE_DIR" == "." ]] && grep -qx 'www' <<<"$remote_target_snapshot" && ! grep -qx 'application.init.php' <<<"$remote_target_snapshot"; then
            strict_remote_dir_validation="${OVH_STRICT_REMOTE_DIR_VALIDATION:-false}"
            remote_dir_warning="The current SFTP session root may be the OVH hosting home rather than the Meteo360 project directory. This can be valid for a first deployment to an empty project root that only contains OVH's default www/ directory. Verify OVH_SFTP_REMOTE_DIR carefully; for a nested deployment, use the project path visible from the current session, for example www/meteo360."

            case "$strict_remote_dir_validation" in
              true|1|yes|on)
                echo "$remote_dir_warning" >&2
                exit 1
                ;;
              *)
                echo "WARNING: $remote_dir_warning Continuing because OVH_STRICT_REMOTE_DIR_VALIDATION is not enabled." >&2
                ;;
            esac
          fi

          lftp -u "$OVH_SFTP_USER","$OVH_SFTP_PASSWORD" -p "$OVH_SFTP_PORT" "sftp://$OVH_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm yes
          $create_remote_target_command
          cd "$REMOTE_DIR"
          mkdir "$write_test_dir"
          rmdir "$write_test_dir"
          quit
          EOF

          if grep -qx 'www' <<<"$remote_target_snapshot"; then
            if ! lftp -u "$OVH_SFTP_USER","$OVH_SFTP_PASSWORD" -p "$OVH_SFTP_PORT" "sftp://$OVH_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm yes
          cd "$REMOTE_DIR"
          cd www
          quit
          EOF
            then
              echo "Remote www entry exists but is not a directory or is not accessible from the resolved deployment target. Check OVH_SFTP_REMOTE_DIR and the type or permissions of the remote www entry." >&2
              exit 1
            fi

            if ! lftp -u "$OVH_SFTP_USER","$OVH_SFTP_PASSWORD" -p "$OVH_SFTP_PORT" "sftp://$OVH_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm yes
          cd "$REMOTE_DIR"
          cd www
          mkdir "$www_write_test_dir"
          rmdir "$www_write_test_dir"
          quit
          EOF
            then
              echo "Remote www/ directory exists but is not writable from the resolved deployment target. Check OVH_SFTP_REMOTE_DIR and the ownership or permissions of the remote www/ directory." >&2
              exit 1
            fi
          fi

      - name: Upload release to OVH SFTP
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          create_remote_target_command=""

          if [[ "$REMOTE_DIR" != "." ]]; then
            create_remote_target_command="mkdir -p \"$REMOTE_DIR\""
          fi

          lftp -u "$OVH_SFTP_USER","$OVH_SFTP_PASSWORD" -p "$OVH_SFTP_PORT" "sftp://$OVH_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm yes
          lcd release
          $create_remote_target_command
          cd "$REMOTE_DIR"
          mkdir -p var/cache
          mkdir -p var/log
          mkdir -p var/sessions
          mirror --reverse --delete --verbose app app
          mirror --reverse --delete --verbose modules modules
          mirror --reverse --delete --verbose plugins plugins
          mirror --reverse --delete --verbose var/config var/config
          mirror --reverse --delete --verbose www www
          put -O . application.init.php
          put -O . project.xml
          quit
          EOF
